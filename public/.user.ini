; Per-project PHP overrides for CGI/FastCGI SAPI (php-fpm).
; Apache mod_php (local XAMPP) ignores this file — see ../.htaccess for that.
; Only PHP_INI_PERDIR/PHP_INI_USER directives are honored here.

upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
