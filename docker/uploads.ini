; Loaded at php-fpm startup via conf.d (system-level, no per-dir cache).
; Keeps upload limits with the project instead of the base image defaults
; (php:8.3-fpm ships no php.ini → 2M/8M compiled defaults).

upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
